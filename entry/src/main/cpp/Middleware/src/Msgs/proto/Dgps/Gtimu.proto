syntax = "proto3";
import "Std/Header.proto";
package Dgps;

message Gtimu {
    Std.Header header = 1;
    string gtimu = 2;                   // $GTIMU...
    double gyroX = 3;                  // 陀螺仪 X 轴角速率，单位（度/秒）
    double gyroY = 4;                  // 陀螺仪 Y 轴角速率，单位（度/秒）
    double gyroZ = 5;                  // 陀螺仪 Z 轴角速率，单位（度/秒）
    double accX = 6;                   // 加速度计 X 轴加速度，单位为（g）
    double accY = 7;                   // 加速度计 Y 轴加速度，单位为（g）
    double accZ = 8;                   // 加速度计 Z 轴加速度，单位为（g）
    double tpr = 9;                     // 温度，单位为摄氏度
}