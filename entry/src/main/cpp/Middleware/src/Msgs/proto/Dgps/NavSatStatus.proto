syntax = "proto3";
package Dgps;

// 导航卫星定位状态消息
message NavSatStatus {
    // 卫星定位状态
    enum Status {
        STATUSNOFIX = 0;    // 无法确定位置
        STATUSFIX = 1;       // 未增强定位
        STATUSSBASFIX = 2;  // 使用卫星增强系统的定位
        STATUSGBASFIX = 3;  // 使用地基增强系统的定位
    }

    Status status = 1;

    // 正在使用哪种GPS服务
    uint32 service = 2;

    // 服务标志常量
    enum Service {
        SERVICEGPS = 0;
        SERVICEGLONASS = 1;
        SERVICECOMPASS = 2;  // 包括北斗系统
        SERVICEGALILEO = 3;
    }
}